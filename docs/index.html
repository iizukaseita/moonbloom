<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moonbloom - よるまると気分きろく</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(180deg, #0f0c29 0%, #1a1a3e 100%);
            color: #E2E8F0;
            min-height: 100vh;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 40px 24px;
            text-align: center;
        }
        h1 {
            font-size: 28px;
            color: #FFF3C4;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 16px;
            color: #A0AEC0;
            margin-bottom: 32px;
        }
        .description {
            font-size: 15px;
            line-height: 1.8;
            color: #E2E8F0;
            margin-bottom: 32px;
            text-align: left;
        }
        .features {
            text-align: left;
            margin-bottom: 32px;
        }
        .features h2 {
            font-size: 18px;
            color: #B794F4;
            margin-bottom: 12px;
        }
        .features li {
            font-size: 14px;
            line-height: 2;
            color: #E2E8F0;
            list-style: none;
            padding-left: 20px;
            position: relative;
        }
        .features li::before {
            content: "・";
            position: absolute;
            left: 0;
        }
        .links {
            margin-top: 32px;
        }
        .links a {
            display: inline-block;
            color: #B794F4;
            text-decoration: none;
            margin: 8px 16px;
            font-size: 14px;
        }
        .links a:hover {
            text-decoration: underline;
        }
        .contact {
            margin-top: 40px;
            font-size: 13px;
            color: #A0AEC0;
        }
        .contact a {
            color: #B794F4;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Moonbloom</h1>
        <p class="subtitle">よるまると気分きろく</p>

        <div class="description">
            Moonbloomは、毎晩マスコットキャラクター「よるまる」が今日の気分を聞いてくれる、かんたん気分きろくアプリです。<br><br>
            気分をえらぶだけで、夜空の庭にお花が咲きます。いい日もわるい日も、ぜんぶお花になります。
        </div>

        <div class="features">
            <h2>とくちょう</h2>
            <ul>
                <li>5秒でおわるかんたん記録</li>
                <li>かわいいマスコット「よるまる」</li>
                <li>お花が育つたのしさ</li>
                <li>広告なし</li>
                <li>データはすべてスマホに保存</li>
            </ul>
        </div>

        <div class="links">
            <a href="privacy">プライバシーポリシー</a>
        </div>

        <div class="contact">
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSfTKA8RngmjJ_1TY1X0i1Inm1MQr6TUYkfCbzprT4oYGZC8Ig/viewform" target="_blank">お問い合わせはこちら</a>
        </div>
    </div>
</body>
</html>
